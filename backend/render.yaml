# render.yaml – Render deployment config for Abdulmula Fashion ERP backend
services:
  - type: web
    name: abdulmula-erp-api
    env: node
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 15m
      - key: JWT_REFRESH_EXPIRE
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: CLIENT_PREVIEW_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_DELIVERY_MODE
        value: disabled
      - key: EMAIL_SENDING_DOMAIN
        sync: false
      - key: EMAIL_DOMAIN_VERIFIED
        value: "false"
