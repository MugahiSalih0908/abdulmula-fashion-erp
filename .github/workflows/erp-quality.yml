name: ERP quality checks

on:
  push:
    branches:
      - main
      - release/premium-workspaces-contrast
      - feature/email-center-infrastructure
      - ui/phase-6-invoice-history
      - ui/phase-7-customer-management
      - ui/phase-8-supplier-management
      - ui/phase-9-financial-management
      - ui/phase-10-purchase-orders
      - ui/phase-11-reports-analytics
      - ui/phase-12-responsive-accessibility
      - ui/phase-13-admin-settings-audit-polish
      - ui/phase-14-authentication-experience
      - ui/phase-15-staff-cashbook-polish
      - perf/phase-17-mobile-performance
      - fix/phase-16-email-invitation-delivery
      - security/**

  pull_request:
    branches:
      - main
      - ui/phase-5-premium-pos-products-cart-staff
      - feature/email-center-infrastructure
      - ui/phase-6-invoice-history
      - ui/phase-7-customer-management
      - ui/phase-8-supplier-management
      - ui/phase-9-financial-management
      - ui/phase-10-purchase-orders
      - ui/phase-11-reports-analytics
      - ui/phase-12-responsive-accessibility
      - ui/phase-13-admin-settings-audit-polish
      - ui/phase-14-authentication-experience
      - ui/phase-15-staff-cashbook-polish

  workflow_dispatch:

# No write permissions are needed by these quality-check jobs.
permissions:
  contents: read

jobs:
  backend:
    name: Backend syntax, tests and security audits
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Audit all backend dependencies
        working-directory: backend
        run: npm audit --audit-level=moderate

      - name: Audit backend production dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=moderate

      - name: Check backend JavaScript syntax
        run: find backend -type f -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Run backend tests
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend tests, production build and security audits
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit all frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate

      - name: Run frontend unit tests
        working-directory: frontend
        run: node --test src/pages/*.test.mjs src/store/*.test.js

      - name: Build frontend
        working-directory: frontend
        run: npm run build
