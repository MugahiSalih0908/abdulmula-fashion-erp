name: ERP quality checks

on:
  push:
    branches:
      - main
      - security/audit-hardening-2026-11-19
      - release/premium-workspaces-contrast
      - feature/email-center-infrastructure
      - ui/phase-6-invoice-history
      - ui/phase-7-customer-management
      - ui/phase-8-supplier-management
      - ui/phase-9-financial-management
      - ui/phase-10-purchase-orders
      - ui/phase-11-reports-analytics
      - ui/phase-12-responsive-accessibility
      - ui/phase-13-admin-settings-audit-polish
      - ui/phase-14-authentication-experience
      - ui/phase-15-staff-cashbook-polish
      - perf/phase-17-mobile-performance
      - fix/phase-16-email-invitation-delivery
      - perf/phase-17-mobile-performance
  pull_request:
    branches:
      - main
      - ui/phase-5-premium-pos-products-cart-staff
      - feature/email-center-infrastructure
      - ui/phase-6-invoice-history
      - ui/phase-7-customer-management
      - ui/phase-8-supplier-management
      - ui/phase-9-financial-management
      - ui/phase-10-purchase-orders
      - ui/phase-11-reports-analytics
      - ui/phase-12-responsive-accessibility
      - ui/phase-13-admin-settings-audit-polish
      - ui/phase-14-authentication-experience
      - ui/phase-15-staff-cashbook-polish

permissions:
  contents: read

jobs:
  refresh-lockfiles:
    name: Apply non-breaking dependency security fixes
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/audit-hardening-2026-11-19'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Remove unused legacy mail dependency
        working-directory: backend
        run: npm uninstall nodemailer --save --package-lock-only --ignore-scripts
      - name: Apply backend fixes within declared semver ranges
        working-directory: backend
        run: |
          npm ci
          npm audit fix || true
      - name: Reconcile frontend lockfile after intentional major upgrades
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Apply frontend fixes within declared semver ranges
        working-directory: frontend
        run: |
          npm ci
          npm audit fix || true
      - name: Commit updated lockfiles to the security branch
        shell: bash
        run: |
          if git diff --quiet -- backend/package-lock.json frontend/package-lock.json; then
            echo "No dependency lockfile updates were needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/package.json backend/package-lock.json frontend/package-lock.json
            git commit -m "chore(deps): apply non-breaking security updates"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

  backend:
    needs: refresh-lockfiles
    if: ${{ always() && (needs.refresh-lockfiles.result == 'success' || needs.refresh-lockfiles.result == 'skipped') }}
    name: Backend syntax and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Report backend dependency advisories
        working-directory: backend
        shell: bash
        run: |
          npm audit --json > /tmp/backend-audit.json || true
          node -e "const a=require('/tmp/backend-audit.json'); const items=Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,via:(v.via||[]).map(x=>typeof x==='string'?x:x.title),fixAvailable:v.fixAvailable})); console.log(JSON.stringify({totals:a.metadata?.vulnerabilities,packages:items},null,2));"
      - name: Report backend production-only advisories
        working-directory: backend
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/backend-production-audit.json || true
          node -e "const a=require('/tmp/backend-production-audit.json'); const items=Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,via:(v.via||[]).map(x=>typeof x==='string'?x:x.title),fixAvailable:v.fixAvailable})); console.log(JSON.stringify({totals:a.metadata?.vulnerabilities,packages:items},null,2));"
      - name: Preview non-breaking backend dependency fixes
        working-directory: backend
        shell: bash
        run: npm audit fix --dry-run || true
      - name: Check backend JavaScript syntax
        run: find backend -type f -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Run backend tests
        working-directory: backend
        run: npm test

  frontend:
    needs: refresh-lockfiles
    if: ${{ always() && (needs.refresh-lockfiles.result == 'success' || needs.refresh-lockfiles.result == 'skipped') }}
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Report frontend dependency advisories
        working-directory: frontend
        shell: bash
        run: |
          npm audit --json > /tmp/frontend-audit.json || true
          node -e "const a=require('/tmp/frontend-audit.json'); const items=Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,via:(v.via||[]).map(x=>typeof x==='string'?x:x.title),fixAvailable:v.fixAvailable})); console.log(JSON.stringify({totals:a.metadata?.vulnerabilities,packages:items},null,2));"
      - name: Report frontend production-only advisories
        working-directory: frontend
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/frontend-production-audit.json || true
          node -e "const a=require('/tmp/frontend-production-audit.json'); const items=Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,via:(v.via||[]).map(x=>typeof x==='string'?x:x.title),fixAvailable:v.fixAvailable})); console.log(JSON.stringify({totals:a.metadata?.vulnerabilities,packages:items},null,2));"
      - name: Preview non-breaking frontend dependency fixes
        working-directory: frontend
        shell: bash
        run: npm audit fix --dry-run || true
      - name: Run frontend unit tests
        working-directory: frontend
        run: node --test src/pages/*.test.mjs src/store/*.test.js
      - name: Build frontend
        working-directory: frontend
        run: npm run build
