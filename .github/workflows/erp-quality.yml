name: ERP quality checks

on:
  push:
    branches:
      - feature/email-center-infrastructure
      - ui/phase-6-invoice-history
      - ui/phase-7-customer-management
      - ui/phase-8-supplier-management
  pull_request:
    branches:
      - ui/phase-5-premium-pos-products-cart-staff
      - feature/email-center-infrastructure
      - ui/phase-6-invoice-history
      - ui/phase-7-customer-management
      - ui/phase-8-supplier-management

jobs:
  backend:
    name: Backend syntax and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Check backend JavaScript syntax
        run: find backend -type f -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Run backend tests
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend unit tests
        working-directory: frontend
        run: node --test src/pages/*.test.mjs src/store/*.test.js
      - name: Build frontend
        working-directory: frontend
        run: npm run build
