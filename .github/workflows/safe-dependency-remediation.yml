name: Safe dependency remediation candidate

on:
  push:
    branches:
      - security/dependency-remediation-2026-11-19

permissions:
  contents: write

jobs:
  update-and-validate:
    name: Apply compatible updates and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dependency-remediation-2026-11-19
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Apply semver-compatible backend security updates
        working-directory: backend
        run: npm audit fix || true
      - name: Validate backend tests and syntax
        run: |
          find backend -type f -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
          cd backend
          npm test
      - name: Report remaining backend production advisories
        working-directory: backend
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/backend-production-audit.json" || true
          node -e "const fs=require('node:fs');const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/backend-production-audit.json','utf8'));console.log('Backend production advisories after safe updates:',JSON.stringify(a.metadata?.vulnerabilities||{}));for(const [name,v] of Object.entries(a.vulnerabilities||{}))console.log(JSON.stringify({package:name,severity:v.severity,direct:v.isDirect,fixAvailable:v.fixAvailable}));"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Apply semver-compatible frontend security updates
        working-directory: frontend
        run: npm audit fix || true
      - name: Run shared financial validation tests
        run: node --test shared/*.test.mjs
      - name: Run frontend unit tests
        working-directory: frontend
        run: node --test src/pages/*.test.mjs src/store/*.test.js src/offline/*.test.mjs src/services/*.test.mjs
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Report remaining frontend production advisories
        working-directory: frontend
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/frontend-production-audit.json" || true
          node -e "const fs=require('node:fs');const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/frontend-production-audit.json','utf8'));console.log('Frontend production advisories after safe updates:',JSON.stringify(a.metadata?.vulnerabilities||{}));for(const [name,v] of Object.entries(a.vulnerabilities||{}))console.log(JSON.stringify({package:name,severity:v.severity,direct:v.isDirect,fixAvailable:v.fixAvailable}));"

      - name: Preserve validated lockfile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No compatible dependency lockfile updates were available."
          else
            git commit -m "fix: apply compatible npm security updates"
            git push origin HEAD:security/dependency-remediation-2026-11-19
          fi
